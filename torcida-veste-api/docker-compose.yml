version: '3'

services:
  mysql:
    image: mysql:latest
    container_name: torcida-veste-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: torcida-veste
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - 3306:3306
    volumes:
      - ./db:/var/lib/mysql
    restart: always
